<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | Spotted Lenity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">Spotted Lenity</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="resellers.html">RESELLER MENU</a></li>
                <li><a href="shop.html">INDIVIDUAL MENU</a></li>
                <li><a href="gallery.html">GALLERY</a></li>
                <li><a href="reviews.html" class="active">REVIEWS</a></li>
            </ul>
        </div>
    </header>

    <a href="checkout.html" class="floating-cart-bubble" title="View Cart">
        <i class="fas fa-shopping-bag" style="font-size: 20px;"></i>
        <span style="font-size: 10px; margin-top: 2px;">Cart</span>
        <span class="cart-count-badge" id="cart-count">0</span>
    </a>

    <section style="text-align: center; padding: 50px 20px 10px;">
        <h1 class="script-font" style="font-size: 52px; margin-bottom: 10px;">Customer Reviews</h1>
        <p style="font-size: 16px; opacity: 0.9;">Real feedback from verified Spotted Lenity clients.</p>
    </section>

    <!-- Submission Form for Real Customers -->
    <section style="max-width: 600px; margin: 20px auto 40px; padding: 0 20px;">
        <div class="liquid-product-card" style="text-align: left; padding: 25px;">
            <h3 class="script-font" style="font-size: 28px; margin-bottom: 15px;">Leave a Review</h3>
            <form id="review-form" style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="font-size: 12px; text-transform: uppercase;">Your Name</label>
                    <input type="text" id="reviewer-name" required placeholder="Enter your name" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); color: #fff;">
                </div>
                <div>
                    <label style="font-size: 12px; text-transform: uppercase;">Rating</label>
                    <select id="reviewer-rating" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: #1C3826; color: #fff;">
                        <option value="5">★★★★★ (5/5)</option>
                        <option value="4">★★★★☆ (4/5)</option>
                        <option value="3">★★★☆☆ (3/5)</option>
                        <option value="2">★★☆☆☆ (2/5)</option>
                        <option value="1">★☆☆☆☆ (1/5)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 12px; text-transform: uppercase;">Your Review</label>
                    <textarea id="reviewer-text" rows="3" required placeholder="Share your experience..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); color: #fff;"></textarea>
                </div>
                <button type="submit" class="btn-glass" style="width: 100%; margin-top: 10px;">Submit Review</button>
            </form>
        </div>
    </section>

    <!-- Dynamic Review Feed -->
    <main id="reviews-list" style="max-width: 1000px; margin: 0 auto 60px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px;">
    </main>

    <footer class="footer-container">
        <h3 class="script-font" style="font-size: 36px;">Contact Us On</h3>
        <div class="social-icons-group">
            <a href="tel:+27000000000" class="social-glass-btn"><i class="fas fa-phone"></i></a>
            <a href="https://wa.me/27000000000" class="social-glass-btn"><i class="fab fa-whatsapp"></i></a>
            <a href="https://instagram.com" class="social-glass-btn"><i class="fab fa-instagram"></i></a>
        </div>
        <p style="margin-top: 25px; font-size: 12px; opacity: 0.7;">&copy; 2026 Spotted Lenity Organic Skincare Products. All rights reserved.</p>
    </footer>

    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadReviews);

        const form = document.getElementById('review-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('reviewer-name').value;
            const rating = parseInt(document.getElementById('reviewer-rating').value);
            const text = document.getElementById('reviewer-text').value;

            const newReview = { name, rating, text, date: new Date().toLocaleDateString() };
            
            let reviews = JSON.parse(localStorage.getItem('sl_user_reviews')) || [];
            reviews.unshift(newReview);
            localStorage.setItem('sl_user_reviews', JSON.stringify(reviews));

            form.reset();
            loadReviews();
        });

        function loadReviews() {
            const container = document.getElementById('reviews-list');
            let reviews = JSON.parse(localStorage.getItem('sl_user_reviews')) || [];

            if (reviews.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; opacity: 0.8;">No client reviews posted yet. Be the first to submit one!</p>';
                return;
            }

            container.innerHTML = reviews.map(r => `
                <div class="liquid-product-card" style="text-align: left; padding: 25px;">
                    <div style="color: #FFD700; margin-bottom: 10px;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                    <p style="font-size: 14px; font-style: italic; margin-bottom: 15px; opacity: 0.95;">"${r.text}"</p>
                    <h4 style="font-size: 15px; font-weight: 600;">— ${r.name}</h4>
                    <span style="font-size: 11px; opacity: 0.6;">${r.date}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
