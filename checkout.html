<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | SKINSHO Skincare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navigation -->
    <header class="site-header">
        <div class="header-container">
            <nav class="nav-left">
                <a href="index.html" class="nav-link">HOME</a>
                <a href="shop.html" class="nav-link">PERSONAL USE</a>
                <a href="shop.html#resellers" class="nav-link">RESELLERS</a>
                <a href="reviews.html" class="nav-link">REVIEWS</a>
            </nav>

            <div class="logo-container">
                <a href="index.html" class="logo">
                    <span class="logo-mark">SKINSHO</span>
                </a>
            </div>

            <div class="nav-right">
                <a href="index.html#about" class="nav-link">ABOUT</a>
                <a href="index.html#contact" class="nav-link">CONTACT</a>
                <a href="checkout.html" class="cart-icon-link active" aria-label="Shopping Cart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span class="cart-badge" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="products-section">
        <div class="products-container">
            <div class="section-header">
                <h1 class="section-title">Your Order & Checkout</h1>
            </div>

            <div class="checkout-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 20px;">
                
                <!-- Order Summary Section -->
                <div class="order-summary-box" style="background-color: var(--color-card-bg); padding: 30px;">
                    <h2 style="font-family: var(--font-heading); font-size: 22px; margin-bottom: 20px;">Cart Summary</h2>
                    
                    <div id="cart-items-container">
                        <!-- Items rendered by cart.js -->
                        <p style="color: var(--color-text-muted); font-size: 14px;">Your cart is currently empty.</p>
                    </div>

                    <div class="cart-totals" style="border-top: 1px solid var(--color-border); margin-top: 20px; padding-top: 20px;">
                        <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 18px;">
                            <span>Total</span>
                            <span id="cart-total-amount">R0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Checkout Form Section -->
                <div class="checkout-form-box" style="background-color: var(--color-white); padding: 30px; border: 1px solid var(--color-border);">
                    <h2 style="font-family: var(--font-heading); font-size: 22px; margin-bottom: 20px;">Delivery Information</h2>
                    
                    <form id="checkout-form" style="display: flex; flex-direction: column; gap: 15px;">
                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px;">FULL NAME</label>
                            <input type="text" id="cust-name" required style="width: 100%; padding: 12px; border: 1px solid var(--color-border); font-family: var(--font-body); font-size: 14px;">
                        </div>

                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px;">EMAIL ADDRESS</label>
                            <input type="email" id="cust-email" required style="width: 100%; padding: 12px; border: 1px solid var(--color-border); font-family: var(--font-body); font-size: 14px;">
                        </div>

                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px;">PHONE NUMBER</label>
                            <input type="tel" id="cust-phone" required style="width: 100%; padding: 12px; border: 1px solid var(--color-border); font-family: var(--font-body); font-size: 14px;">
                        </div>

                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px;">DELIVERY ADDRESS</label>
                            <textarea id="cust-address" rows="3" required style="width: 100%; padding: 12px; border: 1px solid var(--color-border); font-family: var(--font-body); font-size: 14px;"></textarea>
                        </div>

                        <button type="submit" class="add-to-cart-btn" style="background-color: var(--color-dusty-rose); color: var(--color-white); margin-top: 10px; padding: 15px;">PROCEED TO PAYMENT</button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; SKINSHO. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
